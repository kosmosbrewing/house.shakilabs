name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 네트워크·npm 재실행 없이 신원만 대조하는 결정적 검사. 커밋된 산출물이 없으면 no-op.
      - name: Verify vendored artifacts
        run: |
          node scripts/verify-sbom-identity.mjs
          node scripts/verify-vendor-readme.mjs
